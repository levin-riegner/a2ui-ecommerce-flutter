name: Verify

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated localization, state and routes
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib/app/l10n/generated lib/app/navigation/router/app_router.g.dart lib/presentation/stylist/bloc

      - name: Enforce architecture and current asset boundaries
        run: |
          python3 tool/check_architecture.py
          python3 tool/check_release_assets.py

      # iOS needs an installed 27.1+ SDK. Run tool/verify_ios.sh on a compatible
      # Mac before release; do not represent Ubuntu builds as iOS builds.
      - name: Validate catalog assets
        run: python3 tools/catalog/validate.py assets/data/catalog/products.csv

      - name: Test repository tools
        run: python3 -m unittest discover -s tool -p 'test_*.py'

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tools/genkit tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build web app
        run: flutter build web
