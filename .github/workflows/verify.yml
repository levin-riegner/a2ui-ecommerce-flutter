name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce architecture and current asset boundaries
        run: |
          python3 tool/check_architecture.py
          python3 tool/check_release_assets.py

      # iOS needs an installed 27.1+ SDK. Run tool/verify_ios.sh on a compatible
      # Mac before release; do not represent Ubuntu/checkpoint passes as iOS builds.
      - name: Validate catalog assets
        run: python3 tools/catalog/validate.py assets/data/catalog/products.csv

      - name: Verify saved Duo checkpoints
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py'
          python3 tool/verify_duo_checkpoints.py docs/verification/duo-simulator-2026-10-04.json

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tools/genkit tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build web app
        run: flutter build web
