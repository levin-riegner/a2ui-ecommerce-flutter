name: a2ui_flutter_commerce
description: >-
  Alder personal stylist, built with Flutter, declarative A2UI surfaces,
  and local fixture data.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # L+R template architecture. Providers and renderers remain behind adapters.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Keep the GenUI dependency explicit and pinned while its API is evolving.
  # The app's domain code stays behind small adapters so this can be upgraded
  # without changing the fixture or presentation layers.
  a2ui_core: 0.1.1
  genui: 0.10.3
  http: ^1.6.0
  flutter_svg: 2.3.0
  json_schema_builder: ^0.1.7
  # Upgrade this reference stack together; see docs/genkit-reference.md.
  genkit: 1.0.0
  genkit_openai: 1.0.0
  genkit_anthropic: 1.0.0
  genkit_google_genai: 1.0.0
  schemantic: 1.0.0
  foldable: 1.0.5
  # Native dictation: Android speech service, Apple Speech, and browser recognition.
  speech_to_text: 7.5.0
  shared_preferences: 2.5.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  go_router_builder: ^4.4.1
  json_serializable: ^6.14.1
  shared_preferences_platform_interface: 2.4.2
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  config:
    # Flutter 3.44+ uses Swift Package Manager for native iOS/macOS
    # dependencies. Keep this explicit for every checkout of this reference.
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/catalog/
    - assets/images/products/
    - assets/images/occasions/
    - assets/images/finalized_left/
    - assets/icons/commerce/
    - assets/icons/finalized_left/
    - assets/icons/finalized_right/
    - assets/icons/finalized_shared/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 600
    - family: Jost
      fonts:
        - asset: assets/fonts/jost/Jost-Variable.ttf
          weight: 400
        - asset: assets/fonts/jost/Jost-Variable.ttf
          weight: 500
        - asset: assets/fonts/jost/Jost-Variable.ttf
          weight: 600
